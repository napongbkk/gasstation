<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f26">
<title>ระบบจัดการปั๊มน้ำมัน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e6a11a' stroke-width='2'%3E%3Crect x='3' y='3' width='11' height='18' rx='1.5'/%3E%3Cpath d='M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 0 3 0V8l-3-3'/%3E%3C/svg%3E">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: forecourt price-sign header, tab strip, one working surface per task. Sodium-lamp amber on asphalt greys. */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f6f7f9; --ink:#15181d; --muted:#5b6370; --line:#d8dce3;
  --accent:#1d5a82; --accent-ink:#174a6b; --accent-soft:#e3f0f8; --on-accent:#ffffff; --sign:#1b1f26; --sign-ink:#f3c14b;
  --good:#23845a; --good-soft:#e2f3ea; --warn:#b5710a; --warn-soft:#fbefd9; --bad:#c03f33; --bad-soft:#fbe5e2;
  --bar-rev:#8d97a8;
  --f-amber:#e6a11a; --f-blue:#2f6fd0; --f-green:#2e9a5e; --f-red:#d2483b; --f-violet:#7b54c9; --f-slate:#5f6b7c;
  --display:"Barlow Condensed","IBM Plex Sans Thai","Arial Narrow",Tahoma,sans-serif;
  --body:"IBM Plex Sans Thai",Tahoma,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --surface:#1a1d23; --surface-2:#20242b; --ink:#eceef2; --muted:#9aa1ad; --line:#2d323b;
  --accent:#6cb4e4; --accent-ink:#9fcff0; --accent-soft:#16303f; --on-accent:#0b1a26; --sign:#0b0d10; --sign-ink:#f3c14b;
  --good:#4cc08a; --good-soft:#163024; --warn:#e8a542; --warn-soft:#352812; --bad:#ec6b5e; --bad-soft:#3a1c19;
  --bar-rev:#6b7484;
  --f-amber:#f0b23a; --f-blue:#5b93ec; --f-green:#4cbf7f; --f-red:#ec6b5e; --f-violet:#a183e6; --f-slate:#8794a6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1419; --surface:#1a1d23; --surface-2:#20242b; --ink:#eceef2; --muted:#9aa1ad; --line:#2d323b;
  --accent:#6cb4e4; --accent-ink:#9fcff0; --accent-soft:#16303f; --on-accent:#0b1a26; --sign:#0b0d10; --sign-ink:#f3c14b;
  --good:#4cc08a; --good-soft:#163024; --warn:#e8a542; --warn-soft:#352812; --bad:#ec6b5e; --bad-soft:#3a1c19;
  --bar-rev:#6b7484;
  --f-amber:#f0b23a; --f-blue:#5b93ec; --f-green:#4cbf7f; --f-red:#ec6b5e; --f-violet:#a183e6; --f-slate:#8794a6;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.25}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Header = price sign */
.prices{display:flex;flex-wrap:wrap;gap:6px}
.price{background:#000;border:1px solid #2b3038;border-radius:4px;padding:4px 10px 3px;display:flex;flex-direction:column;align-items:flex-end;min-width:96px}
.price .p-name{font-size:11px;color:#aab0bb;display:flex;align-items:center;gap:5px;white-space:nowrap}
.price .p-val{font-family:"Barlow Condensed",var(--display);font-size:24px;line-height:1;color:var(--sign-ink);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Tabs */

/* Common */
.sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin:6px 0 12px}
.sec-head h2{font-size:24px}
.sec-head p{margin:2px 0 0;color:var(--muted);max-width:66ch}
.btn{font:500 14px var(--body);border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.pin-in{font-family:var(--mono);font-size:20px!important;letter-spacing:.4em;text-align:center}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.btn-sign:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.muted{color:var(--muted)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin:16px 0 0;color:var(--ink)}
.banner.local{background:var(--surface-2);border-color:var(--line)}

input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.mono{font-size:13px}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0;background:var(--surface-2)}
.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.fuel{display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}

/* Tanks */
.tank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tank{padding:16px;display:grid;grid-template-columns:70px 1fr;gap:16px}
.tank-top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tank-top h3{font-size:22px}
.tank-top .sub{font-size:12px;color:var(--muted)}
.gauge{position:relative;height:160px;border:2px solid var(--line);border-radius:14px 14px 10px 10px;background:var(--surface-2);overflow:hidden}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;opacity:.9;transition:height .4s ease}
.gauge .low-line{position:absolute;left:0;right:0;border-top:2px dashed var(--bad);opacity:.7}
.gauge .pct{position:absolute;inset:auto 0 6px 0;text-align:center;font:700 20px "Barlow Condensed",var(--display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;align-content:start;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:"Barlow Condensed",var(--display);font-size:20px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
.stat.profit{grid-column:1/-1;background:var(--good-soft);border-radius:6px;padding:6px 10px;margin-top:2px}
.stat.profit .l{color:var(--good);font-weight:600}
.stat.profit .v{color:var(--good);font-size:24px}
.stat.profit.neg{background:var(--bad-soft)}
.stat.profit.neg .l,.stat.profit.neg .v{color:var(--bad)}
.tank-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}

/* Pumps: modern dashboard cards — price as the hero number, ring = connected tank level */
.pump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pump{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 14px;align-items:start}
.pump-hd{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pump-name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;line-height:1.25;min-width:0}
.pump-name .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--fc);background:color-mix(in srgb,var(--fc) 14%,transparent)}
.pump-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fuel-pill{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;color:var(--fc);background:color-mix(in srgb,var(--fc) 12%,transparent);white-space:nowrap}
.pump-price .l{font-size:12px;color:var(--muted)}
.pump-price .v{font:600 40px/1 "Barlow Condensed",var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:4px}
.pump-price .v small{font:500 13px var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:76px}
.ring svg{display:block}
.ring .rt{font-size:11px;color:var(--muted);max-width:90px;text-align:center;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pump-stats{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pump-stats>div{background:var(--surface-2);padding:6px 10px;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;line-height:1.3}
.pump-stats .l{font-size:13px;color:var(--muted);white-space:nowrap}
.pump-stats .v{font-family:"Barlow Condensed",var(--display);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;white-space:nowrap;margin-left:auto}
.pump-stats .v small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.pump-ft{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pump-ft .dot{background:var(--good)}
.pump-ft.none .dot{background:var(--muted)}
.pump.unlinked{border-style:dashed}
.pump-stats.one{grid-template-columns:1fr}
.pump-price{min-width:0}
.pump-price .v.meter-v{font:700 42px/1 "Barlow Condensed",var(--display);color:var(--ink);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px;border-bottom:3px solid var(--fc);display:inline-block;max-width:100%}

/* Price board (first page): compact rows — icon, fuel + change, price on the right */
.pboard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.pb-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.pb-when{display:flex;flex-direction:column}
.pb-l{font-size:12px;color:var(--muted)}
.pb-d{font:700 20px/1.2 var(--display)}
.pb-act{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pb-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pb-tile{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;background:color-mix(in srgb,var(--fc) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--fc) 28%,var(--line));border-left:4px solid var(--fc);min-width:0}
.pb-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--fc);flex:none}
.pb-mid{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;flex:1}
.pb-f{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pb-v{font:700 30px/1 "Barlow Condensed",var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pb-v small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:2px}
.pb-dl{font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;white-space:nowrap}
.pb-dl.up{background:var(--bad-soft);color:var(--bad)}
.pb-dl.down{background:var(--good-soft);color:var(--good)}
.pb-dl.flat{background:var(--surface-2);color:var(--muted)}

/* Fuel credit */
.credit-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.credit-layout{grid-template-columns:1fr}}
.cust-list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:620px;overflow:auto}
.cust-list button{width:100%;background:none;border:0;border-radius:8px;padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;border-left:3px solid transparent}
.cust-list button:hover{background:var(--surface-2)}
.cust-list button.on{background:var(--accent-soft);border-left-color:var(--accent)}
.cl-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.cl-top strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-bal{font-weight:600;white-space:nowrap}
.cl-bal.over{color:var(--bad)}
.cl-bal.zero{color:var(--muted)}
.cl-lim{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.cl-lim .sb{flex:1;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.cl-lim .sb i{display:block;height:100%;background:var(--good)}
.cl-lim .sb i.hi{background:var(--warn)}
.cl-lim .sb i.over{background:var(--bad)}
.cl-age{font-size:12px;color:var(--muted)}
.cust-detail{min-width:0}
.cd-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.cd-head h3{font-size:24px}
.cd-info{font-size:13px}
.cd-bal{display:flex;flex-direction:column;align-items:flex-end}
.cd-bal .l{font-size:12px;color:var(--muted)}
.cd-bal .v{font:700 32px/1.1 "Barlow Condensed",var(--display);font-variant-numeric:tabular-nums}
.cd-bal .v.owe{color:var(--bad)}
.cd-act{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}

/* Summary: cash vs credit */
.credit-sum{margin-top:16px}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.cs-grid>div{background:var(--surface);padding:12px 16px}
.cs-grid .l{font-size:12px;color:var(--muted)}
.cs-grid .v{font:600 26px/1.15 "Barlow Condensed",var(--display);font-variant-numeric:tabular-nums}
.cs-grid .v.good{color:var(--good)}
.cs-grid .v.bad{color:var(--bad)}
.cs-grid .s{font-size:12px;color:var(--muted)}
.cs-grid .cs-hi{background:var(--accent-soft)}
.cs-bar{display:flex;height:12px;margin:14px 16px 6px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.cs-bar i{display:block;height:100%}
.cs-bar .cash,.cs-leg .cash{background:var(--good)}
.cs-bar .cred,.cs-leg .cred{background:var(--warn)}
.cs-leg{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 16px 12px}
.cs-leg span{display:inline-flex;align-items:center;gap:6px}
.cs-leg i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Google Drive status */
.gd-pill{display:inline-flex;align-items:center;gap:7px;max-width:100%}
.gd-pill .gd-name{font-weight:600}
.gd-pill .gd-t{color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
@media (max-width:560px){.gd-pill .gd-name{display:none}}
.gd-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:#8b93a0}
.gd-dot.ok{background:#7dffb8;box-shadow:0 0 0 3px rgba(125,255,184,.25)}
.gd-dot.warn{background:#f0b23a}
.gd-dot.busy{background:#f0b23a;animation:gdp 1s ease-in-out infinite}
.gd-dot.bad{background:#ec6b5e}
@keyframes gdp{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.gd-dot.busy{animation:none}}
.gd-status{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:4px}
.gd-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:13px}
.gd-dl dt{color:var(--muted)}
.gd-dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.gd-dl a{color:var(--accent-ink)}
.gd-auto{display:flex;align-items:center;gap:8px;font-size:14px;padding:10px 12px;background:var(--surface-2);border-radius:8px;flex-wrap:wrap}

/* First page: compact so the whole dashboard fits one desktop screen */
.home .sec-head{margin:14px 0 8px;align-items:center}
.home .sec-head h2{font-size:19px}
.home .sec-head p{display:none}
.home .pboard{padding:12px 14px;gap:10px}
@media (min-width:900px) and (max-width:1149px){.home .pboard{flex-direction:row;align-items:center;gap:16px}.home .pb-hd{flex-direction:column;align-items:flex-start;flex:none;width:250px;gap:6px}.home .pb-tiles{flex:1}}
@media (min-width:1150px){
  .home{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
  .home .pboard{position:sticky;top:12px}
  .home .pb-hd{flex-direction:column;align-items:stretch;gap:8px}
  .home .pb-act{flex-direction:column;align-items:stretch}
  .home .pb-act .btn{width:100%}
  .home .pb-tiles{grid-template-columns:1fr}
  .home .sec-head.first{margin-top:0}
}
.home .pb-act .chip{white-space:normal;line-height:1.4;padding:2px 9px}
.home .sec-head .btn{padding:3px 12px;font-size:13px}
.home .pb-tile{padding:8px 10px;gap:8px}
.home .pb-ic{width:28px;height:28px}
.home .pb-v{font-size:24px}
.home .tank-grid,.home .pump-grid{gap:10px}
.home .pump-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.home .pb-f{white-space:nowrap;font-size:14px}
.wrap{padding-block:0 24px}
.home .tank-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.home .tank{grid-template-columns:minmax(0,1fr);padding:12px 14px;gap:8px}
.home .tank-top h3{font-size:18px}
.home .tank-top .sub{font-size:11px}
.home .gauge{height:12px;border-width:1px;border-radius:6px}
.home .gauge .fill{height:100%!important;width:var(--p);top:0;border-radius:5px 0 0 5px}
.home .gauge .low-line{top:0;bottom:0!important;left:var(--lw);right:auto;border-top:0;border-left:2px dashed var(--bad)}
.home .gauge .pct{display:none}
.home .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px}
.home .stat .l{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home .stat .v{font-size:17px;white-space:nowrap}
.home .stat .v small{font-size:11px}
.home .stat.profit{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:3px 10px;margin-top:4px}
.home .stat.profit .v{font-size:19px}
.home .pump{padding:12px 14px;gap:6px 12px}
.home .pump-name{font-size:16px;gap:8px}
.home .pump-name .ic{width:30px;height:30px;border-radius:8px}
.home .pump-name .ic svg{width:17px;height:17px}
.home .pump-price .l{font-size:11px}
.home .pump-price .v.meter-v{font-size:32px;border-bottom-width:2px}
.home .ring{min-width:56px}
.home .ring svg{width:54px;height:54px}
.home .ring .rt{font-size:10px}
.home .pump-stats>div{padding:3px 10px}
.home .pump-stats .l{font-size:12px}
.home .pump-stats .v{font-size:17px}
.home .pump-ft{display:none}

/* Top bar: one green block — brand + status on the first row, menu pills on the second */
.sign{background:linear-gradient(180deg,#1f5a82,#184766);color:#fff;margin-inline:-16px;padding:12px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.sign .brand{display:flex;align-items:center;gap:12px;min-width:0}
.sign .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:none;color:#fff}
.sign .brand-logo{height:46px;width:auto;flex:none;display:block}
.sign .brand-sep{width:1px;height:34px;background:rgba(255,255,255,.3);flex:none}
.sign .brand-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.sign .eyebrow{font-size:12px;color:rgba(255,255,255,.75)}
.sign h1{font-size:21px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sign-tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.btn-sign{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:10px;padding:0 12px;height:38px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-sign:hover{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.16)}
.tabs{grid-column:1/-1;display:flex;gap:4px;margin:0;padding:4px;border:0;border-radius:12px;background:rgba(0,0,0,.16);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-radius:9px;padding:7px 12px;font:600 14px var(--body);color:rgba(255,255,255,.82);cursor:pointer;white-space:nowrap;flex:1 0 auto;justify-content:center}
.tab svg{flex:none;opacity:.9}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-selected="true"]{background:#fff;color:#184766;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
#banner:not(:empty){margin-bottom:4px}
main#main{margin-top:14px}
@media (max-width:640px){.sign .brand-logo{height:32px}.sign{grid-template-columns:1fr}.sign-tools{justify-content:flex-start}.tab{flex:0 0 auto}.sign h1{font-size:19px}}

#cfm{width:min(440px,calc(100vw - 32px))}
#cfm form{padding:22px 22px 18px}
#cfm h2{font-size:21px}
.cfm-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px;background:var(--accent-soft);color:var(--accent-ink)}
.cfm-ic.bad{background:var(--bad-soft);color:var(--bad)}
.cfm-rows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0 6px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:13px}
.cfm-rows dt{color:var(--muted);white-space:nowrap}
.cfm-rows dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* Arrange mode */
.arr-bar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--accent-ink)}
.arr-bar .btn{padding:2px 12px}
.arr-bar .btn:disabled{opacity:.35;cursor:default}
.arranging{cursor:grab;outline:2px dashed var(--accent);outline-offset:2px}
.arranging.dragging{opacity:.45}
.arranging.drop-t{outline:3px solid var(--accent);background:var(--accent-soft)}

/* Meter */
.meter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.meter-bar label{font-weight:600}
.meter-bar .spacer{flex:1}
.meter-in{width:120px;text-align:right}
.price-in{width:88px;text-align:right}
input:disabled{background:var(--surface-2);color:var(--ink);opacity:1;border-color:transparent;cursor:not-allowed}
.price-in.override{border-color:var(--accent);background:var(--accent-soft)}
.price-strip{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}

.pchip{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px}
.pchip .dot{align-self:center}
.pchip b{font-size:15px}
.pchip small{color:var(--muted);font-size:11px}
td.calc{font-family:var(--mono);font-weight:500;text-align:right;white-space:nowrap}
td.calc.err{color:var(--bad);font-family:var(--body)}
.layout-2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:860px){.layout-2{grid-template-columns:1fr}}
.daylist{list-style:none;margin:0;padding:6px}
.daylist button{width:100%;display:flex;justify-content:space-between;gap:8px;background:none;border:0;border-radius:6px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.daylist button:hover,.daylist button.on{background:var(--surface-2)}
.daylist .d{font-weight:500}
.daylist .x{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);font:700 17px var(--display)}

/* Summary */
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font:500 13px var(--body);color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font:600 30px/1.15 "Barlow Condensed",var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{background:var(--sign);border-color:var(--sign);color:#fff}
.kpi.hero .l,.kpi.hero .s{color:#aab0bb}
.kpi.hero .v{color:var(--sign-ink)}
.chart-box{padding:12px 12px 6px}
.chart-box svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 4px 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:10px;border-radius:2px;display:inline-block}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:16px}
.kpi.pl{background:var(--good-soft);border-color:var(--good)}
.kpi.pl .l,.kpi.pl .v{color:var(--good)}
.kpi.pl.neg{background:var(--bad-soft);border-color:var(--bad)}
.kpi.pl.neg .l,.kpi.pl.neg .v{color:var(--bad)}
td.plc{color:var(--good);font-weight:600}
.share{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.share .sb{width:70px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block}
.share .sb i{display:block;height:100%}
td.plc.neg{color:var(--bad)}
.foot-note{font-size:12px;color:var(--muted);margin-top:10px;max-width:76ch}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,16,.5)}
dialog form{padding:20px}
dialog h2{font-size:24px;margin-bottom:6px}
dialog .note{color:var(--muted);margin:0 0 12px;font-size:13px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fgrid label input,.fgrid label select{font-weight:400;font-size:14px;width:100%}
.form-err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:1em}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:50;max-width:calc(100vw - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
try{document.documentElement.lang='th';}catch(e){}
const COLS=['tanks','nozzles','readings','orders','settings','dayprices','customers','credits'];
const S={tanks:{},nozzles:{},readings:{},orders:{},settings:{},dayprices:{},customers:{},credits:{}};
let db=null, mode='loading';
const loaded=new Set();
const SWATCH={amber:'ส้ม',blue:'น้ำเงิน',green:'เขียว',red:'แดง',violet:'ม่วง',slate:'เทา'};
const FUELS=['ดีเซล B7','แก๊สโซฮอล์ 91'];
const priceMap=()=>(S.settings.prices&&S.settings.prices.prices)||{};
/* Daily selling price: the price set on a date applies from that date until a newer one is set. */
function priceInfo(f,date){let best=null;
  for(const x of Object.values(S.dayprices))if(x&&x.date<=date&&x.prices&&x.prices[f]!=null&&(!best||x.date>best.date))best=x;
  if(best)return {p:+best.prices[f],from:best.date};
  const m=priceMap();if(m[f]!=null)return {p:+m[f],from:null};
  for(const t of Object.values(S.tanks))if(t.fuel===f&&t.sellPrice!=null)return {p:+t.sellPrice,from:null};
  return {p:0,from:null};}
const priceOn=(f,date)=>priceInfo(f,date).p;
const priceOf=f=>priceOn(f,today());
const fuelsUsed=()=>[...new Set([...Object.values(S.tanks).map(t=>t.fuel),...FUELS])];
/* Saves the day's prices, then re-prices saved readings that were using the old carried price (manual overrides are left alone). */
async function setDayPrices(date,changes){
  const ex=S.dayprices[date];
  await put('dayprices',date,{date,prices:{...((ex&&ex.prices)||{}),...changes}});
  let n=0;for(const [k,r] of Object.entries(S.readings)){if(r.date<date)continue;const t=S.tanks[r.tankId];if(!t||changes[t.fuel]==null)continue;
    const np=priceOn(t.fuel,r.date);
    if(Math.abs(np-(+r.price||0))>0.00001){await put('readings',k,{...r,price:np,amount:Math.round((+r.litres||0)*np*100)/100});n++;}}
  return n;}
const COLNAME={tanks:'ถังน้ำมัน',nozzles:'หัวจ่าย',readings:'เลขมิเตอร์',orders:'ใบสั่งซื้อ',settings:'การตั้งค่า',dayprices:'ราคาขายรายวัน',customers:'ลูกค้าสินเชื่อ',credits:'รายการสินเชื่อ'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const DOW=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const fdate=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return d.getDate()+' '+MON[d.getMonth()]+' '+(d.getFullYear()+543)};
const fdateShort=s=>{const d=new Date(s+'T00:00:00');return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const cur=()=> (S.settings.main&&S.settings.main.currency)||'฿';
const nL=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const L=n=>Math.round(+n||0).toLocaleString('en-US');
const M=n=>cur()+' '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const M0=n=>cur()+' '+Math.round(+n||0).toLocaleString('en-US');
const color=k=>'var(--f-'+(SWATCH[k]?k:'slate')+')';

/* ---------- storage ---------- */
function loadLocal(){try{const raw=localStorage.getItem('gsm-data');if(raw){const o=JSON.parse(raw);COLS.forEach(c=>S[c]=o[c]||{});}}catch(e){}}
function saveLocal(){try{localStorage.setItem('gsm-data',JSON.stringify(S));}catch(e){}}
function errMsg(e){if(!e)return 'เกิดข้อผิดพลาด';if(e.code==='quota_exceeded')return 'พื้นที่จัดเก็บเต็ม กรุณาลบข้อมูลเก่าบางส่วนแล้วลองใหม่';if(e.code==='invalid_argument')return 'คุณดูข้อมูลได้ แต่ไม่มีสิทธิ์แก้ไข';return 'บันทึกไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่';}
async function put(c,id,data){S[c]={...S[c],[id]:data};render();try{if(db)await db.collection(c).doc(id).set(data);else{saveLocal();trackChange(c,id,data);}}catch(e){toast(errMsg(e));}}
async function del(c,id){const n={...S[c]};delete n[id];S[c]=n;render();try{if(db)await db.collection(c).doc(id).delete();else{saveLocal();trackChange(c,id,null);}}catch(e){toast(errMsg(e));}}

/* ---------- Standalone (Vercel): Google Sheets is the data store ----------
   The app talks to a small Apps Script web app bound to the user's Google Sheet (see apps-script/Code.gs).
   Changes are sent as a list of edited records; the script merges them under a lock, so several devices can work at once. */
const CFG=window.GSM_CONFIG||{};
const SH={url:'',key:'',state:'setup',saving:false,lastSaved:null,err:'',changes:{},timer:null,rev:null,sheetUrl:''};
const SEP='\u0001';
function shCfgLoad(){try{const o=JSON.parse(localStorage.getItem('gsm-sheet')||'{}');SH.url=o.url||CFG.sheetApiUrl||'';SH.key=o.key||'';SH.sheetUrl=o.sheetUrl||'';}catch(_){SH.url=CFG.sheetApiUrl||'';}}
function shCfgSave(){try{localStorage.setItem('gsm-sheet',JSON.stringify({url:SH.url,key:SH.key,sheetUrl:SH.sheetUrl}));}catch(_){}}
function savePending(){try{localStorage.setItem('gsm-pending',JSON.stringify(SH.changes));}catch(e){}}
function trackChange(c,id,data){if(mode!=='sheet')return;SH.changes[c+SEP+id]=data===undefined?null:data;savePending();scheduleSave();}
function scheduleSave(){clearTimeout(SH.timer);SH.timer=setTimeout(()=>{if(SH.state==='saved'||SH.state==='error')shSave();else renderHeader();},900);}
const allData=()=>Object.fromEntries(COLS.map(c=>[c,S[c]]));
function applyData(data){COLS.forEach(c=>S[c]={...(data[c]||{})});
  for(const [k,v] of Object.entries(SH.changes)){const [c,id]=k.split(SEP);if(!S[c])continue;if(v===null)delete S[c][id];else S[c][id]=v;}
  saveLocal();}
async function shApi(action,extra){
  let r;try{r=await fetch(SH.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:SH.key,action,...(extra||{})})});}
  catch(e){throw new Error('ติดต่อ Google Sheets ไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือว่าตั้ง Who has access เป็น Anyone แล้ว');}
  if(!r.ok)throw new Error('Google Sheets ตอบกลับ '+r.status);
  let j;try{j=await r.json();}catch(_){throw new Error('ลิงก์นี้ไม่ใช่ API ของแอป ใช้ลิงก์ Web app ที่ลงท้ายด้วย /exec');}
  if(!j.ok){const e=new Error({wrong_key:'รหัสเข้าใช้งานไม่ถูกต้อง',key_too_short:'รหัสเข้าใช้งานต้องมีอย่างน้อย 4 ตัวอักษร'}[j.error]||j.error||'เกิดข้อผิดพลาด');e.code=j.error;throw e;}

async function shConnect(url,key){SH.url=String(url||'').trim();SH.key=String(key||'').trim();SH.state='connecting';SH.err='';renderHeader();
  try{const j=await shApi('load');SH.rev=j.rev;SH.sheetUrl=j.sheetUrl||'';shCfgSave();
    const remoteEmpty=!Object.values(j.data||{}).some(o=>o&&Object.keys(o).length);
    const localHas=COLS.some(c=>Object.keys(S[c]).length);
    if(remoteEmpty&&localHas){const r=await shApi('replace',{data:allData()});SH.changes={};savePending();SH.rev=r.rev;applyData(r.data);}
    else applyData(j.data||{});
    SH.state='saved';SH.lastSaved=new Date();render();
    if(Object.keys(SH.changes).length)shSave();
    return true;}
  catch(e){SH.state=e.code==='wrong_key'||!SH.rev?'setup':'error';SH.err=e.message;renderHeader();return e.message;}}
async function shSave(){if(SH.saving)return;const ch=SH.changes;const list=Object.entries(ch).map(([k,v])=>{const [c,id]=k.split(SEP);return {c,id,data:v};});

  SH.saving=true;SH.changes={};SH.state='saving';renderHeader();
  try{const j=await shApi('save',{changes:list});SH.rev=j.rev;applyData(j.data);savePending();SH.lastSaved=new Date();SH.state='saved';SH.err='';render();}
  catch(e){SH.changes={...ch,...SH.changes};savePending();SH.state='error';SH.err=e.message;}
  finally{SH.saving=false;renderHeader();if(Object.keys(SH.changes).length&&SH.state==='saved')scheduleSave();}}
async function shRefresh(){if(mode!=='sheet'||!SH.url||!SH.key||SH.saving)return;

  if(SH.state!=='saved')return;

async function shReplaceAll(data){SH.changes={};savePending();applyData(data);render();

const ordOf=x=>(x&&x.order!=null)?+x.order:1e9;
const tanksSorted=()=>Object.entries(S.tanks).sort((a,b)=>(ordOf(a[1])-ordOf(b[1]))||String(a[1].name).localeCompare(String(b[1].name),'th',{numeric:true}));
const nozzlesSorted=()=>Object.entries(S.nozzles).sort((a,b)=>{if(ordOf(a[1])!==ordOf(b[1]))return ordOf(a[1])-ordOf(b[1]);const ta=S.tanks[a[1].tankId],tb=S.tanks[b[1].tankId];return String(ta?ta.name:'').localeCompare(String(tb?tb.name:''),'th',{numeric:true})||String(a[1].name).localeCompare(String(b[1].name),'th',{numeric:true});});
const delivDate=o=>o.deliveryDate||o.date;
function tankLevel(id){const t=S.tanks[id];if(!t)return 0;let lvl=+t.baseLevel||0;const bd=t.baseDate||'0000-00-00';
  for(const o of Object.values(S.orders))if(o.tankId===id&&o.status==='received'&&delivDate(o)>bd)lvl+=+o.litres||0;
  for(const r of Object.values(S.readings))if(r.tankId===id&&r.date>bd)lvl-=+r.litres||0;
  return lvl;}
function avgCost(tankId,date){let q=0,v=0;for(const o of Object.values(S.orders)){if(o.tankId===tankId&&o.status==='received'&&delivDate(o)<=date){q+=+o.litres||0;v+=(+o.litres||0)*(+o.costPerLitre||0);}}
  if(q>0)return v/q;
  let first=null;for(const o of Object.values(S.orders))if(o.tankId===tankId&&o.status==='received'&&(!first||delivDate(o)<delivDate(first)))first=o;
  if(first)return +first.costPerLitre||0;const t=S.tanks[tankId];return t?(+t.refCost||0):0;}
function dailyAvg(tankId){const dates=[...new Set(Object.values(S.readings).map(r=>r.date))].sort();if(!dates.length)return 0;const last=dates[dates.length-1];const from=addDays(last,-6);
  const days=new Set();let sum=0;for(const r of Object.values(S.readings))if(r.date>=from&&r.date<=last){days.add(r.date);if(r.tankId===tankId)sum+=+r.litres||0;}
  return days.size?sum/days.size:0;}
function lastReading(nid,before){let best=null;for(const r of Object.values(S.readings))if(r.nozzleId===nid&&(!before||r.date<before)&&(!best||r.date>best.date))best=r;return best;}

function openForm({title,note,fields,values={},submitLabel='บันทึก',onSubmit}){
  const dlg=$('#dlg');
  const fld=f=>{const v=values[f.key]??f.default??'';const id='f_'+f.key;const cls=f.full?' class="full"':'';
    if(f.type==='select')return `<label${cls} for="${id}">${esc(f.label)}<select id="${id}" name="${f.key}">${f.options.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(v)?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    return `<label${cls} for="${id}">${esc(f.label)}<input id="${id}" name="${f.key}" type="${f.type||'text'}" value="${esc(v)}"${f.step?` step="${f.step}"`:''}${f.min!=null?` min="${f.min}"`:''}${f.required?' required':''}${f.placeholder?` placeholder="${esc(f.placeholder)}"`:''}></label>`;};
  dlg.innerHTML=`<form id="dlgForm" novalidate><h2>${esc(title)}</h2>${note?`<p class="note">${note}</p>`:''}<div class="fgrid">${fields.map(fld).join('')}</div><p class="form-err" id="formErr"></p><div class="dlg-actions"><button type="button" class="btn ghost" id="dlgCancel">ยกเลิก</button><button type="submit" class="btn primary">${esc(submitLabel)}</button></div></form>`;
  $('#dlgCancel').onclick=()=>dlg.close();
  $('#dlgForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const out={};
    for(const f of fields){let v=fd.get(f.key);if(f.type==='number')v=(v===''||v==null)?null:+v;else v=(v||'').trim();
      if(f.required&&(v===null||v===''||(typeof v==='number'&&isNaN(v)))){$('#formErr').textContent='กรุณากรอก '+f.label;return;}out[f.key]=v;}
    const rows=fields.filter(f=>out[f.key]!==null&&out[f.key]!==''&&out[f.key]!==undefined).slice(0,9).map(f=>{let v=out[f.key];
      if(f.type==='select'){const o=f.options.find(o=>String(o[0])===String(v));v=o?o[1]:v;}else if(f.type==='date')v=fdate(v);else if(f.type==='number')v=(+v).toLocaleString('en-US',{maximumFractionDigits:4});
      return [f.label.replace(/\s*\(.*\)$/,''),String(v)];});
    confirmBox({title:'ยืนยัน: '+title,msg:'ตรวจสอบข้อมูลให้ถูกต้อง แล้วกดยืนยันเพื่อบันทึก',rows,ok:'ยืนยันบันทึก',fn:()=>{const err=onSubmit(out);if(err){$('#formErr').textContent=err;return;}dlg.close();}});};
  dlg.showModal();
}

function pinGate(title,action,fn){/* opening a form needs no confirmation; saving, deleting and replacing do */
  if(action==='ลบ')return confirmBox({title,msg:'การลบไม่สามารถย้อนกลับได้',ok:'ยืนยันการลบ',danger:true,fn});
  if(/แทนที่/.test(action))return confirmBox({title,msg:'ข้อมูลเดิมทั้งหมดจะถูกแทนที่ด้วยข้อมูลจากไฟล์',ok:'ยืนยันแทนที่ข้อมูล',danger:true,fn});
  if(action==='บันทึก')return confirmBox({title,msg:'ตรวจสอบข้อมูลให้ถูกต้อง แล้วกดยืนยันเพื่อบันทึก',ok:'ยืนยันบันทึก',fn});

      if(!(v.amount>0))v.amount=Math.round(v.litres*v.price*100)/100;if(!(v.litres>0))v.litres=v.price?Math.round(v.amount/v.price*100)/100:0;
      const k=txid||'x'+uid();const old=tx?(+tx.amount||0):0;put('credits',k,{...(tx||{}),...v,type:'sale',createdAt:tx&&tx.createdAt||new Date().toISOString()});selCust=v.customerId;
      const c=S.customers[v.customerId]||{};const bal=custBal(v.customerId);

/* ---------- 2. meter readings ---------- */
let mDate=today();const draft={};const unlocked=new Set();
function draftFor(date){if(draft[date])return draft[date];const d={};
  for(const [nid,n] of nozzlesSorted()){const ex=S.readings[date+'_'+nid];const t=S.tanks[n.tankId];
    if(ex)d[nid]={open:ex.open,close:ex.close,price:ex.priceManual?ex.price:null};
    else{const lr=lastReading(nid,date);d[nid]={open:lr?lr.close:(+n.initialMeter||0),close:'',price:null};}}
  draft[date]=d;return d;}
function renderMeters(main){
  const noz=nozzlesSorted();
  if(!noz.length){main.innerHTML=`<div class="sec-head"><div><h2>บันทึกเลขมิเตอร์</h2></div></div><div class="panel empty"><strong>ยังไม่มีหัวจ่ายให้บันทึก</strong>เพิ่มถังน้ำมันและหัวจ่ายที่เมนู "ตั้งค่าถังและหัวจ่าย" ก่อน</div>`;return;}
  const d=draftFor(mDate);const saved=noz.some(([nid])=>S.readings[mDate+'_'+nid]);const locked=saved&&!unlocked.has(mDate);const dis=locked?' disabled':'';
  const dates=[...new Set(Object.values(S.readings).map(r=>r.date))].sort().reverse().slice(0,21);

let rng={preset:'month'};
function presetRange(p){const t=today();const d=new Date(t+'T00:00:00');
  if(p==='today')return [t,t];if(p==='7d')return [addDays(t,-6),t];if(p==='30d')return [addDays(t,-29),t];
  if(p==='month')return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),t];
  if(p==='last'){return [ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))];}
  return [rng.from||t,rng.to||t];}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p;}
const short=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1)+'k':String(Math.round(n));};
function chart(days){
  const n=days.length,W=760,pl=48,pr=10,pb=30,iw=W-pl-pr,bw=iw/n,rot=bw<52,pt=rot?44:22,H=rot?290:262,ih=H-pt-pb;
  const max=niceMax(Math.max(1,...days.map(d=>d.rev)));const y=v=>pt+ih-ih*Math.max(0,v)/max;
  const fmt=v=>bw>=110?Math.round(v).toLocaleString('en-US'):short(v);
  const lbl=(cx,top,v,fill)=>rot
    ?`<text x="${cx}" y="${top-4}" transform="rotate(-90 ${cx} ${top-4})" text-anchor="start" dominant-baseline="middle" font-size="10" font-weight="600" fill="${fill}" font-family="IBM Plex Mono,monospace">${fmt(v)}</text>`
    :`<text x="${cx}" y="${top-5}" text-anchor="middle" font-size="11" font-weight="600" fill="${fill}" font-family="IBM Plex Mono,monospace">${fmt(v)}</text>`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ยอดขายและกำไรขั้นต้นรายวัน">`;
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${short(v)}</text>`;}
  const every=Math.max(1,Math.ceil(n/12));
  days.forEach((d,i)=>{const x=pl+i*bw;const gw=Math.max(1,bw*.36),gap=Math.max(0.5,bw*.04),x0=x+(bw-2*gw-gap)/2,x1=x0+gw+gap;
    s+=`<g><title>${fdate(d.date)}: ยอดขาย ${M(d.rev)}, กำไร ${M(d.profit)}, ${L(d.l)} ลิตร</title>`;
    if(d.rev>0)s+=`<rect x="${x0}" y="${y(d.rev)}" width="${gw}" height="${pt+ih-y(d.rev)}" rx="2" fill="var(--bar-rev)"/>`+lbl(x0+gw/2,y(d.rev),d.rev,'var(--muted)');
    if(d.profit>0)s+=`<rect x="${x1}" y="${y(d.profit)}" width="${gw}" height="${pt+ih-y(d.profit)}" rx="2" fill="var(--accent)"/>`+lbl(x1+gw/2,y(d.profit),d.profit,'var(--accent-ink)');
    s+=`<rect x="${x}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/></g>`;
    if(i%every===0){const dd=new Date(d.date+'T00:00:00');s+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${dd.getDate()} ${MON[dd.getMonth()]}</text>`;}});
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--muted)" stroke-width="1"/></svg>`;return s;}
const pl2=(v,l)=>l?(v/l).toFixed(2):'–';
function renderSummary(main){
  let [from,to]=presetRange(rng.preset);if(from>to)[from,to]=[to,from];
  const rows=Object.values(S.readings).filter(r=>r.date>=from&&r.date<=to);
  let tl=0,tr=0,tc=0;const byT={},byD={},byN={};
  for(const r of rows){const c=(+r.litres||0)*avgCost(r.tankId,r.date);const a=+r.amount||0;tl+=+r.litres||0;tr+=a;tc+=c;
    const tk=S.tanks[r.tankId]||{};const fk=tk.fuel||'ถังที่ถูกลบ';const t=byT[fk]||(byT[fk]={l:0,r:0,c:0,color:tk.color});t.l+=+r.litres||0;t.r+=a;t.c+=c;
    const nz=byN[r.nozzleId]||(byN[r.nozzleId]={l:0,r:0,c:0,days:new Set(),tankId:r.tankId});nz.l+=+r.litres||0;nz.r+=a;nz.c+=c;nz.days.add(r.date);nz.tankId=r.tankId;
    const d=byD[r.date]||(byD[r.date]={l:0,rev:0,cost:0});d.l+=+r.litres||0;d.rev+=a;d.cost+=c;}
  const gp=tr-tc,mg=tr?gp/tr*100:0;
  const purch=Object.values(S.orders).filter(o=>o.status==='received'&&delivDate(o)>=from&&delivDate(o)<=to);
  const pL=purch.reduce((s,o)=>s+(+o.litres||0),0),pV=purch.reduce((s,o)=>s+(+o.total||0),0);
  const days=[];const span=Math.round((new Date(to)-new Date(from))/864e5)+1;
  if(span<=92){for(let x=from;x<=to;x=addDays(x,1)){const d=byD[x]||{l:0,rev:0,cost:0};days.push({date:x,l:d.l,rev:d.rev,profit:d.rev-d.cost});}}
  else Object.keys(byD).sort().forEach(x=>{const d=byD[x];days.push({date:x,l:d.l,rev:d.rev,profit:d.rev-d.cost});});

/* ---------- Google Drive backup ---------- */
const GD='Google Drive';
let mcpNS=null,gdState='checking',gdBusy=false,gdErr='';
const bk=()=>S.settings.backup||{};
function dataSnapshot(){const o={};for(const c of COLS){o[c]={};for(const [k,v] of Object.entries(S[c]))if(!(c==='settings'&&k==='backup'))o[c][k]=v;}return o;}
function hashStr(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36);}
function gdErrState(e){const c=e&&e.code;
  if(c==='needs_reauth')return 'reauth';
  if(c==='server_not_connected'||c==='server_not_found'||c==='selection_required')return 'disconnected';
  if(c==='not_in_manifest'||c==='consent_required'||c==='approval_required')return 'denied';
  if(c==='blocked_by_policy')return 'blocked';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'unavailable';
  return 'error';}
async function gdInit(){let m=null;try{m=window.claude&&window.claude.use?await window.claude.use('mcp'):null;}catch(e){m=null;}
  mcpNS=m;if(!m){gdState='unavailable';renderHeader();return;}
  try{const r=await m.listTools(GD);const sv=(r.servers||[]).find(x=>x.server===GD);
    gdState=!sv?'disconnected':sv.authStatus==='needs_reauth'?'reauth':sv.authStatus==='connected'?'connected':'unknown';}
  catch(e){gdState=gdErrState(e);}
  renderHeader();maybeAuto();}
function maybeAuto(){
  if(gdBusy||gdState!=='connected'||COLS.some(c=>!loaded.has(c)))return;const b=bk();if(b.auto===false)return;
  const last=b.lastAt?new Date(b.lastAt):null;const hash=hashStr(JSON.stringify(dataSnapshot()));
  if(!last||ymd(last)!==today())return backupNow('auto');
  if(hash!==b.lastHash&&Date.now()-last.getTime()>3*3600e3)return backupNow('auto');}
async function backupNow(reason){if(gdBusy||!mcpNS)return;gdBusy=true;gdErr='';renderHeader();renderGdPanel();
  const mkFolder=async()=>{const r=await mcpNS.callTool(GD,'create_file',{title:'Gas Station Backup',contentMimeType:'application/vnd.google-apps.folder'});
    const f=r&&r.payload||{};if(!f.id)throw {code:'tool_error',message:'สร้างโฟลเดอร์สำรองข้อมูลไม่สำเร็จ'};return {folderId:f.id,folderUrl:f.viewUrl||''};};
  try{let b={...bk()};if(!b.folderId)Object.assign(b,await mkFolder());
    const snap=dataSnapshot();const now=new Date();
    const json=JSON.stringify({app:'gas-station-manager',format:1,exportedAt:now.toISOString(),station:(S.settings.main||{}).name||'',data:snap});
    const title=`สำรองข้อมูลปั๊ม ${ymd(now)} ${pad(now.getHours())}.${pad(now.getMinutes())}.json`;
    const send=()=>mcpNS.callTool(GD,'create_file',{title,parentId:b.folderId,textContent:json,contentMimeType:'application/json',disableConversionToGoogleType:true});
    let r;try{r=await send();}catch(e){if(e&&e.code==='tool_error'){/* folder probably removed: make a new one and try once more (tool_error means nothing was written) */Object.assign(b,await mkFolder());r=await send();}else throw e;}
    const f=r&&r.payload||{};
    await put('settings','backup',{...b,auto:b.auto!==false,lastAt:now.toISOString(),lastFile:title,lastUrl:f.viewUrl||'',lastHash:hashStr(JSON.stringify(snap)),lastReason:reason,lastSize:json.length});
    gdState='connected';if(reason!=='auto')toast('สำรองข้อมูลไปที่ Google Drive แล้ว');}
  catch(e){gdState=gdErrState(e);gdErr=(e&&e.message)||'สำรองข้อมูลไม่สำเร็จ';
    if(reason!=='auto')toast('สำรองข้อมูลไม่สำเร็จ: '+gdErr);}
  finally{gdBusy=false;renderHeader();renderGdPanel();}}
const gdWhen=iso=>{if(!iso)return '';const d=new Date(iso);return (ymd(d)===today()?'วันนี้':fdateShort(ymd(d)))+' '+pad(d.getHours())+':'+pad(d.getMinutes())+' น.';};

    unknown:{c:'warn',t:'รออนุญาตการเชื่อมต่อ'},disconnected:{c:'bad',t:'ยังไม่ได้เชื่อมต่อ'},reauth:{c:'bad',t:'ต้องเชื่อมต่อใหม่'},
    denied:{c:'bad',t:'ไม่ได้รับอนุญาต'},blocked:{c:'bad',t:'องค์กรไม่อนุญาต'},unavailable:{c:'off',t:'ใช้ไม่ได้ในหน้านี้'},error:{c:'bad',t:'สำรองไม่สำเร็จ'}})[gdState]||{c:'off',t:''};}

    <label class="gd-auto" for="gdAuto"><input type="checkbox" id="gdAuto"${b.auto!==false?' checked':''}> สำรองอัตโนมัติ <span class="muted">· วันละครั้งเมื่อเปิดแอป และทุก 3 ชั่วโมงถ้ามีข้อมูลเปลี่ยน</span></label>
    <div class="dlg-actions">${gdState==='denied'?'<button type="button" class="btn" id="gdPerm">ตั้งค่าสิทธิ์</button>':''}<button type="button" class="btn ghost" id="gdClose">ปิด</button>
      <button type="button" class="btn primary" id="gdNow"${gdBusy||!mcpNS||['disconnected','blocked','unavailable'].includes(gdState)?' disabled':''}>${gdBusy?'กำลังสำรอง…':'สำรองตอนนี้'}</button></div></div>`;
  $('#gdClose').onclick=()=>dlg.close();
  $('#gdNow').onclick=()=>backupNow('manual');
  $('#gdAuto').onchange=e=>{put('settings','backup',{...bk(),auto:e.target.checked});toast(e.target.checked?'เปิดสำรองอัตโนมัติแล้ว':'ปิดสำรองอัตโนมัติแล้ว');};
  if($('#gdPerm'))$('#gdPerm').onclick=async()=>{try{const p=await window.claude.use('permissions');if(p)await p.manage();}catch(e){toast('เปิดเมนู Permissions ของหน้านี้เพื่อเปิดสิทธิ์ Google Drive');}gdInit();};
  if(!refresh||!dlg.open)dlg.showModal();}
gdInit();setInterval(()=>{maybeAuto();renderHeader();},30*60*1000);
$('#gdPill').onclick=()=>mode==='sheet'?openSheetPanel():openGdPanel();
render();
})();
</script>
</body>
</html>
